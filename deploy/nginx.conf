# leads.digite.com.br -- nginx + PHP-FPM
#
# Copie para /etc/nginx/sites-available/leads.digite.com.br e crie o link em
# sites-enabled. Ajuste as tres marcas CONFIRA antes de recarregar.

server {
    listen 80;
    listen [::]:80;
    server_name leads.digite.com.br;

    # Com Cloudflare em modo "Full", o TLS ja termina la e chega aqui em http. Se voce
    # emitir certificado proprio (recomendado -- modo "Full (strict)"), troque este bloco
    # por um listen 443 ssl e redirecione o 80 para ele.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name leads.digite.com.br;

    # CONFIRA: caminhos do certificado. Com Cloudflare, um Origin Certificate serve.
    ssl_certificate     /etc/ssl/cloudflare/leads.digite.com.br.pem;
    ssl_certificate_key /etc/ssl/cloudflare/leads.digite.com.br.key;

    # CONFIRA: o root aponta para public/, NAO para a raiz do projeto.
    #
    # E a configuracao que torna src/ e .env inalcancaveis por construcao, e nao por regra
    # de rewrite que pode estar desligada. O .htaccess da raiz do projeto e so uma rede de
    # seguranca para quem serve errado -- nginx nem le .htaccess.
    root /var/www/leads/public;

    index index.php;

    charset utf-8;
    client_max_body_size 8m;

    access_log /var/log/nginx/leads.access.log;
    error_log  /var/log/nginx/leads.error.log;

    # --- Roteamento ---------------------------------------------------------------------
    #
    # Arquivo real e servido direto; o resto vai para o front controller. Espelha o que o
    # RewriteCond -f faz no .htaccess.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;

        # CONFIRA: o socket precisa existir. Veja com:
        #     ls -l /run/php/
        # Se o seu PHP for 8.3, o nome muda -- e o fastcgi_pass apontando para um socket
        # inexistente e a causa mais comum de 502 neste tipo de instalacao.
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # ESSENCIAL atras de proxy. Sem isto o PHP nao sabe que o usuario chegou por HTTPS,
        # e o cookie de sessao sai sem a marca Secure.
        #
        # Sobrescreve, nao repassa: o valor vem do $scheme desta conexao, e um cabecalho
        # forjado pelo cliente e descartado.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;

        fastcgi_read_timeout 30s;
    }

    # --- Estaticos ----------------------------------------------------------------------
    #
    # Cache longo com immutable: os arquivos de vendor/ tem versao fixa e nao mudam sem
    # troca de nome. Os proprios (app.css, app.js) mudam a cada deploy -- se isso incomodar,
    # acrescente ?v=<hash> nas tags do layout em vez de encurtar o cache aqui.
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- Bloqueios ----------------------------------------------------------------------
    #
    # Redundante com o root em public/, e permanece como defesa em profundidade: se alguem
    # um dia mover o root por engano, estas regras continuam de pe.
    location ~ /\.(env|git|htaccess) { deny all; return 404; }
    location ~ ^/(src|tools|deploy)/  { deny all; return 404; }

    # --- IP real do visitante -----------------------------------------------------------
    #
    # Sem isto, todo acesso aparece no log com um IP do Cloudflare, e qualquer limite por
    # IP passa a valer para o proxy inteiro em vez de para o usuario.
    #
    # A lista completa e atualizada esta em https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
}
